<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Courier Tracking</h2>
    <form id="trackingForm">
        <label for="courier">Select Courier:</label>
        <select id="courier" required>
            <option value="DTDC">DTDC</option>
            <option value="PROFESSIONAL">Professional Couriers</option>
            <option value="TRACKON">Trackon</option>
            <option value="DELHIVERY">Delhivery</option>
            <option value="SUPERFAST">Superfast</option>
            <option value="DHL">DHL</option>
        </select>

        <label for="tracking_number">Tracking Number:</label>
        <input type="text" id="tracking_number" placeholder="Enter tracking number" required>

        <button type="submit" id="submitBtn">Track Shipment</button>
    </form>

    <div id="result"></div>
</div>

<script>
    document.getElementById('trackingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const courier = document.getElementById('courier').value;
        const trackingNumber = document.getElementById('tracking_number').value;
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        resultDiv.innerHTML = "Checking...";
        resultDiv.className = "";
        submitBtn.disabled = true;

        try {
            const response = await fetch('/track', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    courier: courier,
                    tracking_number: trackingNumber
                })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = data.status;
                resultDiv.className = "success";
            } else {
                resultDiv.innerHTML = data.message;
                resultDiv.className = "error";
            }
        } catch (error) {
            resultDiv.innerHTML = "Error connecting to server!";
            resultDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
