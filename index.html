<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Courier Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 25px; color: #0f172a; font-size: 1.5rem; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #334155; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
        select:focus, input:focus { border-color: #2563eb; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .loader { display: none; text-align: center; margin-top: 20px; color: #2563eb; font-weight: 600; font-size: 0.95rem; }
        .error { display: none; margin-top: 20px; background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; padding: 12px; border-radius: 6px; font-size: 0.9rem; }
        .result { display: none; margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: #334155; }
        .row span { font-weight: 600; color: #0f172a; }
        .status-badge { background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Office Courier Tracker</h2>
        <form id="trackForm">
            <div class="form-group">
                <label for="courier">Select Courier</label>
                <select id="courier" required>
                    <option value="dtdc">DTDC</option>
                    <option value="delhivery">Delhivery</option>
                    <option value="trackon">Trackon</option>
                    <option value="professional">Professional Courier</option>
                </select>
            </div>
            <div class="form-group">
                <label for="trackingNo">Tracking Number</label>
                <input type="text" id="trackingNo" placeholder="Enter Consignment / AWB No" required>
            </div>
            <button type="submit">Track Package</button>
        </form>

        <div id="loader" class="loader">Fetching status from courier server...</div>
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div class="row">
                <span>Courier Service:</span> 
                <span id="rCourier"></span>
            </div>
            <div class="row">
                <span>Tracking Number:</span> 
                <span id="rTrackNo"></span>
            </div>
            <div class="row">
                <span>Status:</span> 
                <span id="rStatus" class="status-badge"></span>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://courier-tracker-app.onrender.com/track";

        document.getElementById('trackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const courier = document.getElementById('courier').value;
            const tracking_no = document.getElementById('trackingNo').value.trim();

            document.getElementById('loader').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').style.display = 'none';

            try {
                const res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ courier, tracking_no })
                });

                const data = await res.json();
                document.getElementById('loader').style.display = 'none';

                if(data.success) {
                    document.getElementById('rCourier').innerText = data.courier;
                    document.getElementById('rTrackNo').innerText = data.tracking_no;
                    document.getElementById('rStatus').innerText = data.status;
                    document.getElementById('result').style.display = 'block';
                } else {
                    showError(data.message || 'Tracking failed. Details not found.');
                }
            } catch(err) {
                document.getElementById('loader').style.display = 'none';
                showError('Server connection error. Please try again.');
            }
        });

        function showError(msg) {
            const err = document.getElementById('error');
            err.innerText = msg;
            err.style.display = 'block';
        }
    </script>
</body>
</html>
